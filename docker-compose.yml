version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: supervision-postgres
    environment:
      POSTGRES_USER: supervision
      POSTGRES_PASSWORD: supervision
      POSTGRES_DB: supervision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
